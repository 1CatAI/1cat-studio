[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onecat-studio"
version = "0.5.0"
description = "A self-hosted inference workbench for 1Cat-vLLM, with independent application services"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-1Cat-Community-1.0"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1", "uvicorn[standard]==0.52.4", "httpx==0.28.1",
  "psutil==7.2.2", "nvidia-ml-py==13.610.43", "modelscope-hub==0.4.0",
  "packaging==26.3", "pillow==12.3.0", "python-multipart==0.0.32", "structlog==26.1.0", "requests==2.34.2",
]

[project.scripts]
onecat-studio = "onecat.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["onecat", "onecat.*"]

[tool.setuptools.package-data]
onecat = ["data/*.json", "creative/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/onecat_tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
